[package]
name = "vearth-platform"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = []
# Async task facade: Tokio on native targets, the reactor worker and blocking
# worker pool in the browser.
rt = [
    "dep:tokio",
    "dep:futures-util",
    "dep:futures-channel",
    "dep:wasm-bindgen-futures",
]

[dependencies]
log = { workspace = true }
# Re-exports std::time natively. In the browser its Instant adds the worker's
# timeOrigin, so instants compare correctly across Web Workers.
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53.1", default-features = false, features = [
    "rt-multi-thread",
    "sync",
    "time",
], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
    "Blob",
    "console",
    "DedicatedWorkerGlobalScope",
    "File",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemHandle",
    "FileSystemRemoveOptions",
    "FileSystemWritableFileStream",
    "MessagePort",
    "StorageManager",
    "WorkerGlobalScope",
    "WorkerNavigator",
    "WritableStream",
    "XmlHttpRequest",
    "XmlHttpRequestResponseType",
] }
# Published assets may be gzip-compressed.
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
futures-util = { version = "0.3.33", default-features = false, features = [
    "std",
], optional = true }
futures-channel = { version = "0.3.33", optional = true }
wasm-bindgen-futures = { version = "0.4.79", optional = true }
