[package]
name = "vearth-data"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = []
# Native async byte/range transports and typed provider cache preparation.
# vearth-app's default async-providers feature enables this; synchronous
# sampling and blocking transports remain available to other callers.
async-http = ["dep:reqwest", "dep:rustls", "dep:tokio", "vearth-platform/rt"]

[dependencies]
vearth-core = { workspace = true }
vearth-platform = { workspace = true }
log = { workspace = true }
png = "0.18.1"
# Mapterhorn terrain tiles are lossless Terrarium-encoded WebP.
image-webp = "0.2.4"
zune-jpeg = "0.5.15"
# Native zlib implementation for PMTiles internals and tile compression.
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
serde_json = "1.0.151"
quick-xml = "0.41.0"
unicode-normalization = "0.1.24"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
osmpbfreader = "0.19.1"
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls-no-provider",
], optional = true }
rustls = { version = "0.23.42", default-features = false, features = [
    "ring",
], optional = true }
tokio = { version = "1.53.1", default-features = false, features = [
    "net",
    "rt-multi-thread",
    "sync",
    "time",
], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS ships SQLite as a stable system library. Keep this aligned with the
# generated-chunk store in vearth-app.
rusqlite = "0.40.1"

[target.'cfg(not(any(target_os = "macos", target_arch = "wasm32")))'.dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }

# The browser build fetches through the reactor worker and stores source
# bytes in the origin-private file system; Tokio supplies only its
# runtime-independent synchronization primitives there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["sync"], optional = true }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
    "AbortController",
    "AbortSignal",
    "Headers",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "WorkerGlobalScope",
    "XmlHttpRequest",
    "XmlHttpRequestResponseType",
] }
